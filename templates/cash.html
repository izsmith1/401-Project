{% extends "base.html" %}
{% block title %}Cash{% endblock %}

{% block content %}
    <h1>Cash</h1>
    <p class="lead">Current balance: <strong>${{ "{:,.2f}".format(current_user.cash_balance) }}</strong></p>
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title h4">Deposit</h2>
                    <form method="POST" action="{{ url_for('deposit') }}">
                        <div class="mb-3">
                            <label for="deposit-amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="deposit-amount" name="amount" step="0.01" min="0.01" required>
                            <div class="form-text" data-preview-for="deposit-amount"></div>
                        </div>
                        <button type="submit" class="btn btn-success">Deposit</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title h4">Withdraw</h2>
                    <form method="POST" action="{{ url_for('withdraw') }}">
                        <div class="mb-3">
                            <label for="withdraw-amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="withdraw-amount" name="amount" step="0.01" min="0.01" required>
                            <div class="form-text" data-preview-for="withdraw-amount"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Withdraw</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    <script>
        // Show what's typed in each amount box as dollars with commas, e.g. 5000 -> $5,000.00
        const dollars = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

        document.querySelectorAll('[data-preview-for]').forEach(function (preview) {
            const input = document.getElementById(preview.dataset.previewFor);
            input.addEventListener('input', function () {
                const value = parseFloat(input.value);
                preview.textContent = value > 0 ? dollars.format(value) : '';
            });
        });
    </script>
{% endblock %}
