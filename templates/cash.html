{% extends "base.html" %}
{% block title %}Cash{% endblock %}

{% block content %}
    <h1>Cash</h1>
    <p class="lead">Current balance: <strong>${{ "{ :,.2f}".format(current_user.cash_balance) }}</strong></p>
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title h4">Deposit</h2>
                    <form method="POST" action="{{ url_for('deposit') }}">
                        <div class="mb-3">
                            <label for="deposit-amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="deposit-amount" name="amount" step="0.01" min="0.01" required>
                        </div>
                        <button type="submit" class="btn btn-success">Deposit</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title h4">Withdraw</h2>
                    <form method="POST" action="{{ url_for('withdraw') }}">
                        <div class="mb-3">
                            <label for="withdraw-amount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="withdraw-amount" name="amount" step="0.01" min="0.01" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Withdraw</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
